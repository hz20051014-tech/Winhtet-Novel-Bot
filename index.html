<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ဝင်းထက်ဝတ္ထုများ</title>



    <style>
        /* =========================================================
           GLOBAL
        ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family:
                "Noto Sans Myanmar",
                "Myanmar Text",
                "Pyidaungsu",
                Arial,
                sans-serif;

            background: #fff4d6;
            color: #241d16;
            min-height: 100vh;
        }

        button {
            font-family: inherit;
        }

        img {
            display: block;
            max-width: 100%;
        }

        .hidden {
            display: none !important;
        }


        /* =========================================================
           MAIN APP
        ========================================================= */

        #app {
            width: 100%;
            min-height: 100vh;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            padding: 28px 18px 40px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        .site-title {
            text-align: center;
            font-size: clamp(28px, 6vw, 48px);
            font-weight: 900;
            letter-spacing: -1px;
            margin: 10px 0 28px;
            line-height: 1.3;
        }

        .title-win {
            color: #c94d16;
        }

        .title-htet {
            color: #b57a00;
        }

        .title-novel {
            color: #cf7777;
        }

        .title-many {
            color: #403b38;
        }

        .category-wrapper {
            width: 100%;
            margin-bottom: 30px;
        }

        .category-tabs {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;

            padding: 7px;
            background: rgba(104, 78, 29, 0.13);
            border: 1px solid rgba(121, 83, 11, 0.12);

            border-radius: 30px;
            box-shadow:
                inset 0 1px 3px rgba(0, 0, 0, 0.06),
                0 5px 18px rgba(101, 72, 14, 0.08);
        }

        .category-btn {
            border: none;
            outline: none;
            cursor: pointer;

            min-height: 55px;
            padding: 8px 10px;

            border-radius: 25px;
            background: transparent;
            color: #594d40;

            font-size: clamp(14px, 3.5vw, 19px);
            font-weight: 700;

            transition:
                transform 0.2s ease,
                background 0.25s ease,
                color 0.25s ease,
                box-shadow 0.25s ease;
        }

        .category-btn:hover {
            transform: translateY(-1px);
        }

        .category-btn.active {
            background:
                linear-gradient(
                    135deg,
                    #ffe4a3,
                    #f4c65f
                );

            color: #4a2b08;
            box-shadow:
                0 5px 15px rgba(172, 116, 13, 0.2);
        }

        .novel-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .novel-card {
            background:
                linear-gradient(
                    145deg,
                    #fffaf0,
                    #fff0ca
                );

            border: 2px solid rgba(180, 128, 31, 0.38);

            border-radius: 28px;
            padding: 12px;

            box-shadow:
                0 8px 25px rgba(112, 77, 12, 0.12);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
            overflow: hidden;
        }

        .novel-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 14px 32px rgba(112, 77, 12, 0.2);
        }

        .novel-image-wrapper {
            position: relative;

            width: 100%;
            aspect-ratio: 3 / 4;

            overflow: hidden;

            border-radius: 18px;
            background: #ead9af;

            cursor: pointer;
        }

        .novel-image {
            width: 100%;
            height: 100%;
            object-fit: cover;

            transition:
                transform 0.4s ease;
        }

        .novel-card:hover .novel-image {
            transform: scale(1.035);
        }

        .image-overlay {
            position: absolute;
            inset: 0;

            display: flex;
            align-items: flex-end;

            padding: 12px;
            background:
                linear-gradient(
                    transparent 55%,
                    rgba(42, 26, 7, 0.45)
                );

            pointer-events: none;
        }

        .novel-info {
            padding: 15px 7px 8px;
            text-align: center;
        }

        .novel-name {
            color: #5b3710;
            font-size: clamp(16px, 4vw, 22px);
            font-weight: 900;

            line-height: 1.45;

            margin-bottom: 6px;
        }

        .novel-caption {
            color: #8b7455;

            font-size: clamp(12px, 3vw, 16px);
            line-height: 1.5;
        }

        .empty-message {
            grid-column: 1 / -1;

            text-align: center;

            padding: 70px 20px;

            color: #8a7657;

            font-size: 18px;
        }

        #detailPage {
            background:
                linear-gradient(
                    180deg,
                    #fff6df 0%,
                    #fff0c9 100%
                );
        }

        .detail-container {
            max-width: 850px;
            margin: 0 auto;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: none;
            cursor: pointer;

            background: rgba(156, 105, 15, 0.12);

            color: #65430d;

            padding: 10px 18px;
            border-radius: 22px;

            font-size: 16px;
            font-weight: 700;

            margin-bottom: 22px;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .back-button:hover {
            background: rgba(156, 105, 15, 0.2);
            transform: translateX(-2px);
        }

        .detail-image-wrapper {
            width: 100%;

            aspect-ratio: 16 / 10;

            overflow: hidden;

            border-radius: 28px;

            background: #ead9af;

            box-shadow:
                0 15px 40px rgba(83, 57, 10, 0.18);

            margin-bottom: 22px;
        }

        .detail-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .detail-name {
            color: #bd5a17;

            font-size: clamp(30px, 7vw, 50px);
            font-weight: 900;

            line-height: 1.25;

            margin-bottom: 5px;
        }

        .detail-role {
            color: #806b4b;

            font-size: clamp(16px, 4vw, 22px);
            margin-bottom: 25px;
        }

        .summary-box {
            background:
                linear-gradient(
                    145deg,
                    #fffaf0,
                    #f8e9c4
                );

            border: 1px solid rgba(135, 94, 15, 0.16);
            border-radius: 25px;

            padding: 24px;

            box-shadow:
                0 8px 25px rgba(104, 72, 10, 0.09);

            margin-bottom: 25px;
        }

        .summary-title {
            color: #9c6510;

            font-size: clamp(22px, 5vw, 30px);

            font-weight: 900;

            margin-bottom: 15px;
        }

        .summary-text {
            color: #3e342a;

            font-size: clamp(15px, 3.8vw, 19px);

            line-height: 1.9;
        }

        .read-button-wrapper {
            display: flex;
            justify-content: center;

            margin-top: 10px;
        }

        .read-button {
            min-width: 210px;
            border: none;
            cursor: pointer;

            padding: 14px 32px;

            border-radius: 30px;

            background:
                linear-gradient(
                    135deg,
                    #ffe9a9,
                    #d99a21
                );

            color: #4b2b06;

            font-size: 20px;
            font-weight: 900;

            box-shadow:
                0 7px 20px rgba(159, 104, 10, 0.22);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .read-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 11px 25px rgba(159, 104, 10, 0.3);
        }

        .read-button:active {
            transform: translateY(1px);
        }

        #storyPage {
            background: #fffaf0;
        }

        .story-container {
            max-width: 850px;
            margin: 0 auto;
        }

        .story-header {
            text-align: center;

            padding: 10px 0 25px;
        }

        .story-title {
            color: #9c6510;
            font-size: clamp(27px, 7vw, 44px);

            font-weight: 900;

            line-height: 1.35;
        }

        .story-subtitle {
            color: #947c5a;
            font-size: 15px;

            margin-top: 6px;
        }

        .story-content {
            background: #ffffff;

            border-radius: 24px;

            padding: clamp(20px, 5vw, 38px);

            border: 1px solid rgba(117, 79, 11, 0.12);
            box-shadow:
                0 7px 25px rgba(94, 64, 8, 0.08);

            margin-bottom: 30px;
        }

        .story-content p {
            color: #17120e;
            font-size: clamp(16px, 4vw, 20px);

            line-height: 2;

            text-align: left;

            margin-bottom: 20px;
        }

        .story-content p:last-child {
            margin-bottom: 0;
        }

        .story-navigation {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;

            margin-top: 20px;
        }

        .story-navigation.single {
            grid-template-columns: 1fr;
        }

        .part-button {
            border: none;
            cursor: pointer;

            min-height: 55px;
            padding: 10px 15px;

            border-radius: 28px;

            background:
                linear-gradient(
                    135deg,
                    #ffe9a8,
                    #d99b25
                );
                color: #4b2c07;

            font-size: 17px;
            font-weight: 900;

            box-shadow:
                0 6px 16px rgba(159, 104, 10, 0.18);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .part-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 9px 20px rgba(159, 104, 10, 0.25);
        }

        .part-button:active {
            transform: translateY(1px);
        }

        .part-button.disabled {
            opacity: 0;
            pointer-events: none;
        }

        @media (max-width: 600px) {

            .page {
                padding: 20px 12px 30px;
            }

            .site-title {
                margin-top: 5px;
                margin-bottom: 20px;
            }

            .category-tabs {
                gap: 4px;
                padding: 5px;
            }

            .category-btn {
                min-height: 50px;
                padding: 6px 4px;
                font-size: 13px;
            }

            .novel-grid {
                gap: 12px;
            }

            .novel-card {
                padding: 8px;
                border-radius: 20px;
            }

            .novel-image-wrapper {
                border-radius: 14px;
            }

            .novel-info {
                padding: 10px 3px 6px;
            }

            .detail-image-wrapper {
                aspect-ratio: 4 / 5;
                border-radius: 22px;
            }

            .summary-box {
                padding: 18px;
                border-radius: 20px;
            }

            .story-content {
                padding: 18px;
                border-radius: 20px;
            }

            .story-navigation {
                gap: 8px;
            }

            .part-button {
                font-size: 15px;
                padding: 8px;
            }
        }

        @media (max-width: 380px) {

            .novel-grid {
                gap: 9px;
            }

            .novel-card {
                padding: 6px;
            }

            .category-btn {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

<div id="app">

    <!-- =========================================================
         HOME PAGE
    ========================================================== -->

    <section id="homePage" class="page">

       <div class="container">

           <h1 class="site-title">
                <span class="title-win">ဝင်း</span><span
                    class="title-htet">ထက်</span><span
                    class="title-novel">ဝတ္ထု</span><span
                    class="title-many">များ</span>
            </h1>

            <div class="category-wrapper">

                <div class="category-tabs">

                    <button
                        class="category-btn active"
                        data-category="BL"
                        onclick="changeCategory('BL', this)">

                        BL ဝတ္ထုများ
                    </button>

                    <button
                        class="category-btn"
                        data-category="GL"
                        onclick="changeCategory('GL', this)"
                    >
                        GL ဝတ္ထုများ
                    </button>

                    <button
                        class="category-btn"
                        data-category="Normal"
                        onclick="changeCategory('Normal', this)"
                    >
                        Normal ဝတ္ထုများ
                    </button>

                </div>

            </div>

            <div id="novelGrid" class="novel-grid"></div>

        </div>

    </section>

<!-- DETAIL PAGE -->

   <section id="detail-page" class="page hidden">

       <div class="detail-container">


        <!-- Back Button -->

           <button 
               class="back-button"
               onclick="goHome()"
           >
               ←နောက်သို့
           </button>



        <!-- Character / Novel Image -->

           <div class="detail-image-box">

               <img 
                   id="detail-image"
                   class="detail-image"
                   src="https://placehold.co/600x800"
                   alt="Novel Image"
               >

           </div>



        <!-- Name -->

           <h1 
               id="detail-name"
               class="detail-name"
           >
           </h1>



        <!-- Role -->

           <p 
               id="detail-role"
               class="detail-role"
           >
           </p>



        <!-- Story Summary -->

           <div class="summary-box">


               <h2 class="summary-title">
                   ဇာတ်လမ်းအကျဉ်း
               </h2>


               <p 
                   id="detail-summary"
                   class="summary-text"
               >
               </p>


           </div>




        <!-- Start Reading Button -->

           <div class="read-button-wrapper">


               <button
                   class="read-button"
                   onclick="startReading()"
               >
                   ဖတ်ရှုမယ်
               </button>


           </div>



       </div>


   </section>


<!-- STORY READER PAGE -->

   <section id="story-page" class="page hidden">


       <div class="story-container">


           <button 
               class="back-button"
               onclick="goDetail()"
           >
               ←နောက်သို့
           </button>


           <header class="story-header">

               <h1
                   id="storyTitle"
                   class="story-title"
               ></h1>
               <div
                   id="storySubtitle"
                   class="story-subtitle"
               ></div>

           </header>




        <!-- Story Content -->

            <article
                id="storyContent"
                class="story-content"
            ></article>


        <!-- Story Navigation -->

            <div
                id="storyNavigation"
                class="story-navigation"
            ></div>

        </div>

    </section>

</div>


<script>

/* =========================================
   TELEGRAM MINI APP
========================================= */

const tg = window.Telegram?.WebApp;

if (tg) {

    tg.ready();

    if (typeof tg.expand === "function") {
        tg.expand();
    }

    if (typeof tg.setHeaderColor === "function") {
        tg.setHeaderColor("#fff0c9");
    }

    if (typeof tg.setBackgroundColor === "function") {
        tg.setBackgroundColor("#fff4d6");
    }

    if (typeof tg.setBottomBarColor === "function") {
        tg.setBottomBarColor("#fff0c9");
    }
}


/* =========================================
   CURRENT NOVEL / PART
========================================= */

let currentNovel = null;

let currentPart = 1;


/* =========================================

========================================= */

const novels = [

    {

        role: "The One Who Lives Only For You",

        image: "https://placehold.co/600x800",

        summary:
            "သူ့ဘဝတစ်လျှောက်လုံးမှာ ချစ်ခြင်းမေတ္တာကို မယုံကြည်ခဲ့သူတစ်ယောက်။ " +
            "ဒါပေမယ့် သူ့ဘဝထဲကို မမျှော်လင့်ဘဲ ဝင်ရောက်လာတဲ့သူတစ်ယောက်ကြောင့် " +
            "အရာအားလုံး ပြောင်းလဲသွားခဲ့သည်။",

        parts: {

            1: `
Part - 1

ဒီနေရာမှာ သင့်ရဲ့ Part - 1
ဇာတ်လမ်းစာသားအပြည့်အစုံကို
ထည့်နိုင်ပါတယ်။

ဇာတ်လမ်းစာသားများကို ဒီနေရာမှာ
ရေးသားပေးရမှာ ဖြစ်ပါတယ်။
            `,
