        }

        }

        }

            background: transparent;
            color: #594d40;

            transition:

        .category-btn:hover {
            transform: translateY(-1px);
        }

                    #f4c65f

            border-radius: 28px;
            padding: 12px;

            box-shadow:

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
            overflow: hidden;
        }

        .novel-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 14px 32px rgba(112, 77, 12, 0.2);
        }

        .novel-image-wrapper {
            position: relative;

            width: 100%;
            aspect-ratio: 3 / 4;

            overflow: hidden;

            border-radius: 18px;
            background: #ead9af;

            cursor: pointer;
        }

        .novel-image {
            width: 100%;
            height: 100%;
            object-fit: cover;

            transition:
                transform 0.4s ease;
        }

        .novel-card:hover .novel-image {
            transform: scale(1.035);
        }

        .image-overlay {
            position: absolute;
            inset: 0;

            display: flex;
            align-items: flex-end;

            padding: 12px;
            background:
                linear-gradient(
                    transparent 55%,
                    rgba(42, 26, 7, 0.45)
                );

            pointer-events: none;
        }

        .novel-info {
            padding: 15px 7px 8px;
            text-align: center;
        }

        .novel-name {
            color: #5b3710;
            font-size: clamp(16px, 4vw, 22px);
            font-weight: 900;

            line-height: 1.45;

            margin-bottom: 6px;
        }

        .novel-caption {
            color: #8b7455;

            font-size: clamp(12px, 3vw, 16px);
            line-height: 1.5;
        }

        .empty-message {
            grid-column: 1 / -1;

            text-align: center;

            padding: 70px 20px;

            color: #8a7657;

            font-size: 18px;
        }

                    #fff6df 0%,

         HOME PAGE

    <section id="homePage" class="page">

                </div>

            </div>

            <div id="novelGrid" class="novel-grid"></div>

        </div>

    </section>

<!-- DETAIL PAGE -->

   <section id="detailPage" class="page hidden">

       <div class="detail-container">


        <!-- Back Button -->

           <button 
               class="back-button"
               onclick="goHome()"
           >
               ←နောက်သို့
           </button>

                   class="detail-image"
                   src=""
                   alt="Novel image"
               >

           </div>



        <!-- Name -->

           <h1 
               id="detailName"
               class="detail-name"
           >
           </h1>



        <!-- Role -->

           <p 
               id="detailRole"
               class="detail-role"
           >
           </p>



        <!-- Story Summary -->

           <div class="summary-box">


               <h2 class="summary-title">
                   ဇာတ်လမ်းအကျဉ်း
               </h2>


               <p 
                   id="detailSummary"
                   class="summary-text"
               >
               </p>


           </div>




        <!-- Start Reading Button -->

           <div class="read-button-wrapper">


               <button
                   class="read-button"
                   onclick="startReading()"
               >
                   ဖတ်ရှုမယ်
               </button>


           </div>



       </div>


   </section>


<!-- STORY READER PAGE -->

   <section id="storyPage" class="page hidden">


       <div class="story-container">


           <button 
               class="back-button"
               onclick="goDetail()"
           >
               ←နောက်သို့
           </button>


           <header class="story-header">

               <h1
                   id="storyTitle"
                   class="story-title"
               ></h1>
               <div
                   id="storySubtitle"
                   class="story-subtitle"
               ></div>

           </header>




        <!-- Story Content -->

            <article
                id="storyContent"
                class="story-content"
            ></article>


        <!-- Story Navigation -->

            <div
                id="storyNavigation"
                class="story-navigation"
            ></div>

        </div>

    </section>

</div>

let currentCategory = "BL";

    let currentNovel = null;

    let currentPart = 1;

const homePage =
        document.getElementById("homePage");

    const detailPage =
        document.getElementById("detailPage");

    const storyPage =
        document.getElementById("storyPage");
  
    const novelGrid =
        document.getElementById("novelGrid");
    
    function renderNovels() {

        novelGrid.innerHTML = "";

        const filteredNovels =
            novels.filter(
                novel => novel.category === currentCategory
            );

        if (filteredNovels.length === 0) {

            novelGrid.innerHTML = 
                <div class="empty-message">
                    ဒီအမျိုးအစားမှာ ဝတ္ထုမရှိသေးပါ။
                </div>
            ;

            return;
        }

        filteredNovels.forEach(novel => {

        const card = document.createElement("article");

        card.className = "novel-card";

        card.innerHTML = `

            <div
                    class="novel-image-wrapper"
                    onclick="openNovel(${novel.id})">

                <img
                    class="novel-image"
                    src="${novel.image}"
                    alt="${escapeHTML(novel.name)}"
                    loading="lazy"
                >
                <divided class="image-overlay"></div>

            </div>

            <div class="novel-info">

                <div class="novel-name">
                    ${escapeHTML(novel.name)}
                </div>

                <div class="novel-caption">
                    ${escapeHTML(novel.caption)}
                </div>

            </div>

        `;

        novelGrid.appendChild(card);

    });
}

function changeCategory(category, button) {

    currentCategory = category;

    document
        .querySelectorAll(".category-btn")
        .forEach(btn => {
            btn.classList.remove("active");
        });

    button.classList.add("active");
 

    renderNovels();

    window.scrollTo({
            top: 0,
            behavior: "smooth"
    });

}

function openNovel(id) {

    const novel =
        novels.find(item => item.id === id);

    if (!novel) {
        return;
    }

    currentNovel = novel
    document.getElementById("detailImage").src =
        novel.image;

    document.getElementById("detailName").textContent =
        novel.name;

    document.getElementById("detailRole").textContent =
        novel.role;

    document.getElementById("detailSummary").textContent =
        novel.summary;

    homePage.classList.add("hidden");

    detailPage.classList.remove("hidden");

    storyPage.classList.add("hidden");

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}

function goHome() {

        detailPage.classList.add("hidden");

        storyPage.classList.add("hidden");

        homePage.classList.remove("hidden");


        window.scrollTo({
            top: 0,
            behavior: "instant"
        });

    }

function goDetail() {

        storyPage.classList.add("hidden");

        detailPage.classList.remove("hidden");


        window.scrollTo({
            top: 0,
            behavior: "instant"
        });

    }

function startReading() {

        currentPart = 1;

        renderStory();

        detailPage.classList.add("hidden");

        storyPage.classList.remove("hidden");


        window.scrollTo({
            top: 0,
            behavior: "instant"
        });

    }

function renderStory() {

    if (!currentNovel) {

        return;

    }


    const part = currentNovel. parts[currentPart];

    if (!part) {

        return;
    }
        document.getElementById("storyTitle").textContent = part.title;
 
        document.getElementById("storySubtitle").textContent =
            currentNovel.name;


        const content =
            document.getElementById("storyContent");


        content.innerHTML = "";

        part.text.forEach(paragraph => {

            const p =
                document.createElement("p");

            p.textContent = paragraph;

            content.appendChild(p);

        });
    

    renderStoryNavigation();

}

function renderStoryNavigation() {


    const navigation =        document.getElementById("storyNavigation");


    navigation.innerHTML = "";

    const totalParts =     Object. keys(currentNovel.parts).length; 

    // Part 1 → Center Part 2

    if (currentPart === 1) {

        navigation. className =     "story-navigation single";
        if (totalParts >= 2) {

            const nextButton =
                createPartButton(
                    "Part - 2",
                    () => {
                       currentPart = 2;
                       renderStory();
                       window.scrollTo({
            top: 0,
            behavior: "instant"
            });

         }

     );

    
navigation.appendChild(nextButton);

         }

         return;
     }

     navigation.className =
            "story-navigation";


        if (currentPart > 1) {

            const previousButton =
                createPartButton(
                    `Part - ${currentPart - 1}`,  

                    () => {

                        currentPart--;
                        renderStory();
                        window.scrollTo({
            top: 0,
            behavior: "instant"
            });

         }

     );

navigation.appendChild(previousButton);

        } 

        if (currentPart < totalParts) {

            const nextButton =
                createPartButton(
                    `Part - ${currentPart + 1}`,
                    () => {

                        currentPart++;
                        renderStory();
                        window.scrollTo({
            top: 0,
            behavior: "instant"
            });

         }

     );
            navigation.appendChild(nextButton);

        }

    }

function createPartButton(
    text, callback) {


    const button =
        document.createElement("button");


    button.className =
        `part-button`;


    button.textContent =
        text;


    button.addEventListener(
        "click",
        callback
    );

    return button;

}

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

renderNovels();
